<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Real-Time Surveillance Command</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #06090e;
            --panel-bg: #0f1520;
            --border-color: #2a3b54;
            --text-main: #f0f4f8;
            --text-muted: #8b9eb0;
            --primary: #00ffcc;
            --alert: #ff3344;
            --font-ui: 'Inter', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- CONTROL BAR --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 60px;
            background: #090d14;
            border-bottom: 1px solid var(--border-color);
        }

        .title {
            font-family: var(--font-mono);
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-indicator {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--alert);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 68, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(255, 51, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 68, 0); }
        }

        .bot-selector {
            display: flex;
            gap: 10px;
        }

        .bot-tab {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
        }

        .bot-tab.active, .bot-tab:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(0, 255, 204, 0.05);
        }

        /* --- DASHBOARD GRID --- */
        .dashboard {
            flex: 1;
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 15px;
            padding: 15px;
            height: calc(100vh - 60px);
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            background: #0c111a;
        }

        .panel-content {
            flex: 1;
            position: relative;
            display: flex;
        }

        /* --- MAP PANEL (LEFT GRID) --- */
        .map-wrapper {
            grid-row: 1 / 4;
            grid-column: 1 / 2;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #111;
        }

        /* --- CAMERA PANEL (TOP RIGHT) --- */
        .camera-wrapper {
            grid-row: 1 / 3;
            grid-column: 2 / 3;
        }

        #camera-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
            background: #040608;
            position: relative;
            z-index: 2;
        }

        .no-signal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-mono);
            color: var(--text-muted);
            pointer-events: none;
            z-index: 1;
        }

        /* --- AI & SENSORS (BOTTOM RIGHT SPLIT) --- */
        .data-panel-wrapper {
            grid-row: 3 / 4;
            grid-column: 2 / 3;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .data-list {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 13px;
        }

        .data-label {
            color: var(--text-muted);
        }

        .data-val {
            color: var(--primary);
            font-weight: 700;
        }

    </style>
</head>
<body>

    <header class="top-bar">
        <div class="title">
            <div class="live-indicator"></div>
            RT_SURVEILLANCE_OP
        </div>
        
        <div class="bot-selector">
            <button class="bot-tab active" id="tab-bot1" onclick="switchBot('bot1')">BOT_01_PRIMARY</button>
            <button class="bot-tab" id="tab-bot2" onclick="switchBot('bot2')">BOT_02_SECONDARY</button>
        </div>
    </header>

    <main class="dashboard">
        
        <!-- MAP PANEL -->
        <section class="panel map-wrapper">
            <header class="panel-header">
                <span>TACTICAL MAP [GPS]</span>
                <span id="bot-status" style="color: var(--primary);">SYNCED: BOT1</span>
            </header>
            <div class="panel-content">
                <div id="map"></div>
            </div>
        </section>

        <!-- CAMERA PANEL -->
        <section class="panel camera-wrapper" id="camera-panel">
            <header class="panel-header">
                <span>OPTICAL FEED</span>
            </header>
            <div class="panel-content">
                <span class="no-signal">NO STREAM URL SIGNAL</span>
                <img id="camera-stream" src="" alt="Live Camera Stream">
            </div>
        </section>

        <!-- AI & SENSOR BLOCKS -->
        <div class="data-panel-wrapper">
            <!-- AI PANEL -->
            <section class="panel" id="ai-panel">
                <header class="panel-header">
                    <span>AI ANALYTICS</span>
                </header>
                <div class="panel-content">
                    <div class="data-list">
                        <div class="data-item">
                            <span class="data-label">PERSON DETECTED</span>
                            <span class="data-val" id="ai-person">--</span>
                        </div>
                        <div class="data-item">
                            <span class="data-label">CONFIDENCE</span>
                            <span class="data-val" id="ai-confidence">--</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SENSOR PANEL -->
            <section class="panel">
                <header class="panel-header">
                    <span>TELEMETRY</span>
                </header>
                <div class="panel-content">
                    <div class="data-list">
                        <div class="data-item">
                            <span class="data-label">RADAR/MESH</span>
                            <span class="data-val" id="sensor-radar">--</span>
                        </div>
                        <div class="data-item">
                            <span class="data-label">GPS SATS</span>
                            <span class="data-val" id="sensor-satellites">--</span>
                        </div>
                    </div>
                </div>
            </section>
        </div>

    </main>

    <!-- !!! REPLACE THIS KEY WITH YOUR ACTUAL GOOGLE MAPS API KEY !!! -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap" async defer></script>
    
    <!-- Connect Firebase Logic -->
    <script type="module" src="firebase.js"></script>

</body>
</html>
