<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Border Swarm Control</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Orbitron for sci-fi/military look -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>SWARM OVERWATCH</h1>
      <p class="subtitle">Autonomous Border Patrol Network</p>
    </header>
    
    <div class="bots-grid">
      <!-- Bot 1 Card -->
      <div class="bot-card" id="bot1-card">
        <div class="card-header">
          <h2>BOT 01 (N20/Encoder)</h2>
          <div class="status-indicator" id="bot1-status">OFFLINE</div>
        </div>
        <div class="metrics">
          <div class="metric">
            <span class="label">Distance</span>
            <span class="value" id="bot1-distance">-- cm</span>
          </div>
          <div class="metric">
            <span class="label">Blocked</span>
            <span class="value" id="bot1-blocked">--</span>
          </div>
          <div class="metric">
            <span class="label">Peer Sync</span>
            <span class="value" id="bot1-peer">--</span>
          </div>
        </div>
      </div>

      <!-- Bot 2 Card -->
      <div class="bot-card" id="bot2-card">
        <div class="card-header">
          <h2>BOT 02 (Dummy/BO)</h2>
          <div class="status-indicator" id="bot2-status">OFFLINE</div>
        </div>
        <div class="metrics">
          <div class="metric">
            <span class="label">Distance</span>
            <span class="value" id="bot2-distance">-- cm</span>
          </div>
          <div class="metric">
            <span class="label">Blocked</span>
            <span class="value" id="bot2-blocked">--</span>
          </div>
          <div class="metric">
            <span class="label">Peer Sync</span>
            <span class="value" id="bot2-peer">--</span>
          </div>
        </div>
      </div>
    </div>
    
    <div class="controls">
      <div class="input-group">
        <label>Bot 1 IP Address:</label>
        <input type="text" id="bot1-ip" value="10.92.180.224">
      </div>
      <div class="input-group">
        <label>Bot 2 IP Address:</label>
        <input type="text" id="bot2-ip" value="10.92.180.7">
      </div>
      <button id="connect-btn">INITIATE RADAR SCAN</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
